name: Train model

on:
  pull_request:
    branches: [production]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Train
      run: az ml job create
        --file ./src/job.yml
        --set inputs.training_data.path=azureml://subscriptions/1d6d14e8-ffb8-4c80-a6fa-32a7c4bfa2be/resourcegroups/ML-Azure-Dev-ops-training/workspaces/ML-Azure-Dev-ops-training/datastores/workspaceblobstore/paths/LocalUpload/36097ef2315572f74f4f65485b810592213294e30846493c0dc5aff37260fc7d/data/
        --resource-group ML-Azure-Dev-ops-training
        --workspace-name ML-Azure-Dev-ops-training
        --stream
  experiment:
    runs-on: ubuntu-latest
    environment: staging
    needs: experiment
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Train
      run: az ml job create
        --file ./src/job.yml
        --set inputs.training_data.path=azureml://subscriptions/1d6d14e8-ffb8-4c80-a6fa-32a7c4bfa2be/resourcegroups/ML-Azure-Dev-ops-training/workspaces/ML-Azure-Dev-ops-training/datastores/workspaceblobstore/paths/LocalUpload/4f7e65a8ee5d5eda900b312245c97b4389538df5c7a90df8189bcd7c468c2672/data/
        --resource-group ML-Azure-Dev-ops-training
        --workspace-name ML-Azure-Dev-ops-training
        --stream
